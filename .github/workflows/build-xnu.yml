name: build-xnu

# Builds Apple's XNU (Darwin) kernel on a macOS runner.
#
# Why this doesn't call `make` directly: the OSS XNU build needs the Kernel
# Development Kit (KDK) plus several Apple OSS subprojects to be built first
# (AvailabilityVersions -> availability.pl, bootstrap_cmds -> mig, Libsystem/
# libplatform headers, dtrace -> ctfconvert). blacktop/darwin-xnu-build
# maintains a working recipe + version-specific patches for all of this.
# This workflow installs the KDK (publicly mirrored by Dortania) and runs it.

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: "macOS release to build XNU for (must match runner's SDK)"
        required: true
        default: "14.5"
  push:
    branches: [ main ]

jobs:
  build:
    name: XNU ${{ github.event.inputs.macos_version || '14.5' }} (AVMAPPLE/VMAPPLE)
    runs-on: macos-14
    timeout-minutes: 240
    env:
      MACOS_VERSION: ${{ github.event.inputs.macos_version || '14.5' }}
      KERNEL_CONFIG: RELEASE
      ARCH_CONFIG: ARM64
      MACHINE_CONFIG: VMAPPLE
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun -sdk macosx -show-sdk-path
          sw_vers

      - name: Install build prerequisites
        run: |
          # The recipe's install_deps() insists on `gum` and `xcodes`; we don't
          # use them (Xcode is preinstalled and MACOS_VERSION is set), so stub
          # them out instead of fighting brew's missing xcodes bottle.
          mkdir -p "$RUNNER_TEMP/ci-bin"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/ci-bin/gum"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/ci-bin/xcodes"
          chmod +x "$RUNNER_TEMP/ci-bin/gum" "$RUNNER_TEMP/ci-bin/xcodes"
          echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
          command -v jq cmake ninja || brew install jq cmake ninja

      - name: Fetch proven XNU build recipe
        run: git clone --depth 1 https://github.com/blacktop/darwin-xnu-build.git "$RUNNER_TEMP/xnu-build"

      - name: Build XNU (installs matching KDK, builds prerequisites, compiles kernel)
        working-directory: ${{ runner.temp }}/xnu-build
        run: bash -x ./build.sh

      - name: List kernel artifacts
        run: |
          find "$RUNNER_TEMP/xnu-build/fakeroot/System/Library/Kernels" -type f -print
          find "$RUNNER_TEMP/xnu-build/build" -name 'kernel.*' -print

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: xnu-${{ env.MACOS_VERSION }}-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}
          path: |
            ${{ runner.temp }}/xnu-build/fakeroot/System/Library/Kernels/
            ${{ runner.temp }}/xnu-build/build/xnu.obj/kernel.*
          if-no-files-found: error
